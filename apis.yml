name: wantful
description: Wantful was a personalized online gift-giving service founded in 2011 by John
  Poisson, based in San Francisco and New York City, that let shoppers assemble curated gift
  books of design-forward products which recipients could browse and redeem for the item they
  most wanted. Backed by Slow Ventures and others (roughly $5.5M raised) and partnered with
  Nordstrom, the company shut down in September 2013 after failing to secure follow-on funding.
  It is defunct — wantful.com resolves (Route53 NS) but serves no live product, and there is no
  API, documentation, or developer surface to enrich.
